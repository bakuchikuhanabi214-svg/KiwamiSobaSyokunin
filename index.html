<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>極細そば切り名人</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b1d14">
<meta property="og:title" content="極細そば切り名人">
<meta property="og:description" content="ぎりぎりまで細く切って、何本切れるか勝負！">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:#2b1d14;color:#f5ead7;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;overflow:hidden;touch-action:none;overscroll-behavior:none;position:fixed;inset:0}
  #wrap{max-width:720px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:22px;margin:4px 0;letter-spacing:.1em}
  #hud{display:flex;gap:14px;font-size:15px;font-family:system-ui,sans-serif;align-items:baseline}
  #hud b{font-size:20px;color:#ffd27a}
  #snd{background:none;border:1px solid #f5ead755;color:#f5ead7;font-size:14px;padding:4px 10px;margin:0;border-radius:8px;letter-spacing:0;font-family:system-ui,sans-serif}
  canvas{width:100%;display:block;border-radius:10px;flex:1;min-height:0;touch-action:none}
  #msg{text-align:center;font-family:system-ui,sans-serif;font-size:14px;opacity:.85;margin:6px 0 2px;min-height:20px}
  .overlay{position:fixed;inset:0;background:rgba(20,12,6,.86);display:flex;align-items:center;justify-content:center;z-index:5}
  .card{background:#f5ead7;color:#2b1d14;border-radius:14px;padding:24px 22px;max-width:420px;width:92%;text-align:center;box-shadow:0 10px 40px #000a}
  .card h2{margin:0 0 6px;font-size:28px;letter-spacing:.15em}
  .card p{font-family:system-ui,sans-serif;font-size:14px;line-height:1.7;margin:8px 0}
  .big{font-size:56px;font-weight:bold;color:#a8321e;line-height:1.1}
  .rank{font-size:22px;margin:4px 0 8px}
  button{font-family:inherit;font-size:18px;padding:12px 22px;border:none;border-radius:10px;background:#a8321e;color:#fff;cursor:pointer;margin:6px 4px;letter-spacing:.1em}
  button.sub{background:#111;font-family:system-ui,sans-serif;font-size:15px}
  .hidden{display:none}
  small{opacity:.7}
  @media (max-width:380px){ h1{font-size:18px} #hud{gap:10px;font-size:13px} #hud b{font-size:17px} }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>極細そば切り名人</h1>
    <div id="hud">
      <div>本数 <b id="cnt">0</b></div>
      <div>切れ <b id="brk">0</b>/3</div>
      <div>最高 <b id="best">0</b></div>
      <button id="snd">♪ ON</button>
    </div>
  </header>
  <canvas id="cv"></canvas>
  <div id="msg">画面を長押しで包丁を送る → 離すとトン！</div>
</div>

<div id="start" class="overlay">
  <div class="card">
    <h2>極細そば切り</h2>
    <p><b>長押し</b>で包丁を送り、<b>離す</b>と切ります。<br>
    細いほど本数が増える。でも細すぎると<b style="color:#a8321e">ぶち切れ</b>！<br>
    2.0mmを超えると「うどん」扱いで0本。切れ3回で終了。</p>
    <p style="text-align:left;font-size:13px;background:#e9dcc3;border-radius:8px;padding:8px 12px">
    ⚠ 包丁の送りは<b>速さが波打つ</b>うえ、切るほど加速<br>
    ⚠ 時間が経つと<b>生地が乾いて</b>ぶち切れラインが上がる<br>
    → 素早く、正確に、迷わず切れ！</p>
    <button id="go">打ち始め</button>
  </div>
</div>

<div id="end" class="overlay hidden">
  <div class="card">
    <h2 id="endTitle">打ち上がり</h2>
    <div class="big"><span id="score">0</span><span style="font-size:24px">本</span></div>
    <div class="rank" id="rank"></div>
    <p id="detail"></p>
    <button id="retry">もう一枚</button>
    <button id="share" class="sub">𝕏 でポスト</button>
  </div>
</div>

<script>
(() => {
  // ===== 難易度設定 =====
  const DOUGH = 60;            // 生地の幅 mm
  const BREAK0 = 1.0;          // 開始時のぶち切れライン mm
  const DRY_RATE = 0.009;      // 乾燥でラインが上がる速さ mm/秒
  const BREAK_MAX = 1.5;      // ぶち切れラインの上限
  const UDON = 2.0;            // これ超えでうどん
  const SPEED_START = 3.4;     // 送り速度(開始) mm/s
  const SPEED_END = 8.5;       // 送り速度(終盤) mm/s
  const WOBBLE = 0.5;          // 速度の揺れ幅 (±50%)
  const MAX_BREAKS = 3;

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  let W = 0, H = 0, dpr = 1;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);

  let best = 0;
  try { best = +localStorage.getItem('soba_best_v2') || 0; } catch(e){}
  $('best').textContent = best;

  // =========================================================
  //  サウンド
  // =========================================================
  let ac = null, master, sfxBus, bgmBus, soundOn = true;
  function audio(){
    if(!ac){
      try{
        ac = new (window.AudioContext||window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
        sfxBus = ac.createGain(); sfxBus.gain.value = .9; sfxBus.connect(master);
        bgmBus = ac.createGain(); bgmBus.gain.value = .32; bgmBus.connect(master);
        // 簡易リバーブ（和室っぽい響き）
        const conv = ac.createConvolver(), len = ac.sampleRate*1.6, ir = ac.createBuffer(2,len,ac.sampleRate);
        for (let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
        conv.buffer = ir; reverb = ac.createGain(); reverb.gain.value = .25;
        reverb.connect(conv).connect(master);
      }catch(e){ ac = null; }
    }
    if (ac && ac.state === 'suspended') { try{ ac.resume(); }catch(e){} }
    return ac;
  }
  let reverb = null;
  const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
  const mtof = m => 440 * Math.pow(2, (m-69)/12);

  function noiseBuf(dur){
    const b = ac.createBuffer(1, Math.max(1,ac.sampleRate*dur), ac.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return b;
  }
  // フィルタ付きノイズ一発
  function nz(t, dur, ftype, freq, q, vol, dest, decayPow=2){
    const s = ac.createBufferSource(); s.buffer = noiseBuf(dur);
    const f = ac.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t+dur);
    s.connect(f).connect(g).connect(dest); s.start(t); s.stop(t+dur);
    return g;
  }
  function osc(t, type, f0, f1, dur, vol, dest, attack=.002){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+attack);
    g.gain.exponentialRampToValueAtTime(.0008, t+dur);
    o.connect(g).connect(dest); o.start(t); o.stop(t+dur+.02);
    return g;
  }

  // ---- 効果音 ----
  function sfxCut(width, bp){
    if(!audio()) return; const t = ac.currentTime;
    // シャッ（刃が生地を通る）
    nz(t, .045, 'highpass', 5000, .7, .35, sfxBus);
    // トン（包丁がまな板に当たる）
    osc(t+.025, 'sine', 210, 70, .12, .9, sfxBus);
    nz(t+.025, .06, 'bandpass', 900, 3, .5, sfxBus);   // 木の響き
    nz(t+.025, .008, 'highpass', 3000, .5, .4, sfxBus); // アタックのカチッ
    const rel = width - bp;
    if (rel < 0.15){ // 神切り：チーン
      const g1 = osc(t+.05, 'sine', 2093, 0, 1.2, .18, sfxBus, .003);
      osc(t+.05, 'sine', 3136, 0, .9, .09, sfxBus, .003);
      if (reverb) g1.connect(reverb);
    } else if (rel < 0.4){ // 名人：小さい鈴
      osc(t+.05, 'sine', 1568, 0, .35, .08, sfxBus, .003);
    }
    buzz(12);
  }
  function sfxBreak(){
    if(!audio()) return; const t = ac.currentTime;
    nz(t, .04, 'highpass', 4000, .7, .3, sfxBus);
    osc(t+.02, 'sine', 160, 50, .2, .8, sfxBus);
    for (let i=0;i<7;i++) nz(t+.04+i*.035+Math.random()*.02, .05, 'bandpass', 600+Math.random()*1500, 2, .35, sfxBus); // ボロボロ
    osc(t+.05, 'sawtooth', 140, 55, .45, .12, sfxBus);
    buzz([60,40,120]);
  }
  function sfxUdon(){
    if(!audio()) return; const t = ac.currentTime;
    osc(t, 'sine', 120, 60, .25, .7, sfxBus);
    nz(t, .12, 'lowpass', 400, 1, .4, sfxBus);
    osc(t+.08, 'triangle', 300, 180, .3, .12, sfxBus);
  }
  function sfxEnd(good){
    if(!audio()) return; const t = ac.currentTime;
    // 拍子木 カン、カン
    [0, .35].forEach(d => { nz(t+d, .09, 'bandpass', 2400, 12, 1.2, sfxBus); osc(t+d, 'sine', 2400, 0, .12, .25, sfxBus); });
    if (good){ const g = osc(t+.8, 'sine', 1046, 0, 2, .2, sfxBus, .005); if (reverb) g.connect(reverb); }
  }

  // ---- 和風BGM（琴＋太鼓＋拍子木）----
  const ksCache = {};
  function ksBuf(midi){
    if (ksCache[midi]) return ksCache[midi];
    const sr = ac.sampleRate, f = mtof(midi), N = Math.round(sr/f), len = Math.floor(sr*2.2);
    const b = ac.createBuffer(1, len, sr), d = b.getChannelData(0);
    for (let i=0;i<N;i++) d[i] = (Math.random()*2-1)*.8;
    const decay = midi > 70 ? .992 : .996;
    for (let i=N;i<len;i++) d[i] = decay*.5*(d[i-N] + d[i-N-1 < 0 ? 0 : i-N-1]);
    return ksCache[midi] = b;
  }
  function koto(t, midi, vol=.5, bend=false){
    const s = ac.createBufferSource(); s.buffer = ksBuf(midi);
    if (bend){ s.playbackRate.setValueAtTime(1, t+.12); s.playbackRate.linearRampToValueAtTime(1.0595, t+.3); } // 押し手
    const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 3200;
    const g = ac.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(bgmBus);
    if (reverb) g.connect(reverb);
    s.start(t); s.stop(t+2.2);
  }
  function taiko(t, vol=1){ osc(t, 'sine', 110, 48, .45, vol, bgmBus, .004); nz(t, .07, 'lowpass', 700, 1, vol*.4, bgmBus); }
  function shime(t, vol=.4){ osc(t, 'sine', 330, 200, .08, vol, bgmBus); nz(t, .03, 'bandpass', 1800, 2, vol*.5, bgmBus); }
  function hyoshigi(t, vol=.5){ nz(t, .07, 'bandpass', 2400, 12, vol*2, bgmBus); }

  // 都節音階 (E F A B C) のメロディ。null=休符
  const _ = null;
  const MEL = [
    // A
    76,_,72,71, 69,_,71,_,   72,71,69,65, 64,_,_,_,
    69,_,71,72, 76,_,77,76,  72,_,71,69, 71,_,_,_,
    // B
    69,71,72,_, 71,69,65,_,  64,65,69,_, 65,64,59,_,
    64,_,65,69, 71,_,72,71,  69,_,65,_,  64,_,_,_,
    // C（盛り上がり）
    81,_,77,76, 77,_,76,72,  71,72,76,_, 72,71,69,_,
    76,77,76,72, 71,_,69,71, 72,_,71,_,  69,65,64,_,
  ];
  const BENDS = new Set([5, 22, 38, 54, 70]);   // 押し手を入れる位置
  const BASS = [52, 52, 47, 47, 45, 45, 47, 47, 52,52,45,45, 47,47,52,52, 57,57,52,52, 53,53,52,52];
  let bgmTimer = null, bgmStep = 0, bgmNext = 0, bgmIntensity = 0;
  function bgmStart(){
    if (!audio() || bgmTimer) return;
    bgmStep = 0; bgmNext = ac.currentTime + .15;
    bgmTimer = setInterval(bgmTick, 25);
  }
  function bgmStop(){ if (bgmTimer){ clearInterval(bgmTimer); bgmTimer = null; } }
  function bgmTick(){
    if (!soundOn) { bgmNext = ac.currentTime + .1; return; }
    const bpm = 88 + bgmIntensity*38;
    const stepDur = 60/bpm/2;   // 8分音符
    while (bgmNext < ac.currentTime + .12){
      const i = bgmStep % MEL.length, inBar = i % 8, t = bgmNext;
      const m = MEL[i];
      if (m) koto(t, m, .42, BENDS.has(i));
      if (inBar % 4 === 0){ const bn = BASS[Math.floor(i/4) % BASS.length]; koto(t, bn - 12, .38); if (inBar===0) koto(t, bn, .2); }
      // 打楽器
      if (inBar === 0) taiko(t, .9);
      if (inBar === 4 && bgmIntensity > .25) taiko(t, .6);
      if (inBar === 6) shime(t, .35);
      if (inBar === 7) shime(t, .25);
      if (bgmIntensity > .5 && (inBar === 2 || inBar === 3)) shime(t, .22);
      if (bgmIntensity > .75 && inBar === 5) taiko(t, .5);
      if (i % 32 === 0) hyoshigi(t, .4);
      bgmStep++; bgmNext += stepDur;
    }
  }
  $('snd').onclick = e => {
    e.stopPropagation(); audio();
    soundOn = !soundOn;
    if (master) master.gain.value = soundOn ? 1 : 0;
    $('snd').textContent = soundOn ? '♪ ON' : '♪ OFF';
  };

  // =========================================================
  //  ゲーム
  // =========================================================
  let state = 'title';
  let pos, w, holding, strands, good, breaks, combo, maxCombo, knifeDrop, shake, popups, startT, phase, holdT;

  function reset(){
    pos = 0; w = 0; holding = false; strands = []; good = 0; breaks = 0;
    combo = 0; maxCombo = 0; knifeDrop = 0; shake = 0; popups = []; startT = performance.now();
    phase = Math.random()*Math.PI*2; holdT = 0;
    updateHud();
  }
  function updateHud(){ $('cnt').textContent = good; $('brk').textContent = breaks; }

  const elapsed = () => (performance.now() - startT)/1000;
  const breakAt = () => Math.min(BREAK_MAX, BREAK0 + elapsed()*DRY_RATE);
  // 送り速度：進むほど加速＋波打つ
  function curSpeed(){
    const base = SPEED_START + (SPEED_END - SPEED_START) * (pos / DOUGH);
    const t = performance.now()/1000;
    const wob = Math.sin(t*4.3 + phase)*0.65 + Math.sin(t*7.1 + phase*1.7)*0.35;
    return base * (1 + WOBBLE * wob);
  }

  function press(){
    audio();
    if (state !== 'play' || holding) return;
    holding = true; w = 0; holdT = 0;
  }
  function release(){
    if (state !== 'play' || !holding) return;
    holding = false;
    if (w < 0.05) { w = 0; return; }
    cut();
  }
  function cut(){
    const width = Math.min(w, DOUGH - pos);
    const bp = breakAt();
    let kind;
    if (width < bp) kind = 'break';
    else if (width > UDON) kind = 'udon';
    else kind = 'ok';
    strands.push({x:pos, w:width, kind, seed:Math.random()*1000});
    pos += width; w = 0; knifeDrop = 1;
    if (kind === 'ok'){
      good++; combo++; maxCombo = Math.max(maxCombo, combo); sfxCut(width, bp);
      const rel = width - bp;
      let label = width.toFixed(2)+'mm', color = '#fff';
      if (rel < 0.15){ label = '神切り！ '+label; color = '#ffd27a'; }
      else if (rel < 0.4) label = '名人 '+label;
      popups.push({text:label, t:performance.now(), color});
    } else if (kind === 'break'){
      breaks++; combo = 0; shake = 1; sfxBreak();
      popups.push({text:'ぶち切れ！ '+width.toFixed(2)+'mm', t:performance.now(), color:'#ff6a50'});
      $('msg').textContent = `切れ ${breaks}/${MAX_BREAKS}`;
    } else {
      combo = 0; sfxUdon();
      popups.push({text:'うどん… '+width.toFixed(2)+'mm', t:performance.now(), color:'#bbb'});
    }
    updateHud();
    if (breaks >= MAX_BREAKS) return finish('生地崩壊');
    if (DOUGH - pos < breakAt()) return finish('打ち上がり');
  }
  function finish(title){
    state = 'end';
    const oks = strands.filter(s=>s.kind==='ok');
    const avg = oks.length ? oks.reduce((a,s)=>a+s.w,0)/oks.length : 0;
    const isBest = good > best;
    if (isBest){ best = good; try{ localStorage.setItem('soba_best_v2', best); }catch(e){} $('best').textContent = best; }
    $('endTitle').textContent = title;
    $('score').textContent = good;
    $('rank').textContent = rankOf(good) + (isBest && good>0 ? ' 🎉自己ベスト' : '');
    $('detail').innerHTML = `平均の太さ <b>${avg.toFixed(2)}mm</b>　最大連続 <b>${maxCombo}</b>本<br>ぶち切れ ${breaks}回 / うどん ${strands.filter(s=>s.kind==='udon').length}本 / ${elapsed().toFixed(1)}秒`;
    bgmStop(); sfxEnd(title === '打ち上がり');
    setTimeout(()=>$('end').classList.remove('hidden'), 900);
  }
  function rankOf(n){
    if (n >= 40) return '【伝説】更科の神';
    if (n >= 34) return '【名人】江戸の職人';
    if (n >= 28) return '【一人前】のれん分け';
    if (n >= 22) return '【見習い】まだ太い';
    if (n >= 14) return '【素人】田舎そば';
    return '【論外】それはすいとん';
  }
  function startGame(){
    audio();
    $('start').classList.add('hidden'); $('end').classList.add('hidden');
    reset(); state = 'play'; bgmIntensity = 0; bgmStart();
    $('msg').textContent = '画面を長押しで包丁を送る → 離すとトン！';
  }

  // ---- input ----
  const isUI = t => t.closest && t.closest('button, .overlay');
  document.addEventListener('touchstart', e => {
    if (isUI(e.target)) return;
    e.preventDefault(); press();
  }, {passive:false});
  document.addEventListener('touchend', e => { if (e.touches.length === 0) release(); }, {passive:false});
  document.addEventListener('touchcancel', release);
  document.addEventListener('touchmove', e => { if (!isUI(e.target)) e.preventDefault(); }, {passive:false});
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' || isUI(e.target)) return;
    e.preventDefault(); press();
  });
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') release(); });
  window.addEventListener('blur', release);
  document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  window.addEventListener('keydown', e => { if (e.code==='Space'){ e.preventDefault(); if(!e.repeat) press(); }});
  window.addEventListener('keyup', e => { if (e.code==='Space'){ e.preventDefault(); release(); }});

  $('go').onclick = startGame;
  $('retry').onclick = startGame;
  $('share').onclick = () => {
    const text = `極細そば切り名人で ${good}本 切った！\n${rankOf(good)}\n#極細そば切り名人`;
    const url = location.href.split('#')[0];
    window.open('https://x.com/intent/post?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url), '_blank');
  };

  // ---- draw ----
  function rand(seed){ const x = Math.sin(seed)*10000; return x - Math.floor(x); }

  function draw(now, dt){
    const playing = state === 'play';
    if (playing){
      bgmIntensity = pos / DOUGH;
      if (holding){
        w += curSpeed() * dt; holdT += dt;
        if (pos + w >= DOUGH){ w = DOUGH - pos; holding=false; cut(); }
      }
    }
    knifeDrop = Math.max(0, knifeDrop - dt*6);
    shake = Math.max(0, shake - dt*3);
    const bp = playing ? breakAt() : BREAK0;

    ctx.clearRect(0,0,W,H);
    ctx.save();
    if (shake) ctx.translate((Math.random()-.5)*12*shake, (Math.random()-.5)*8*shake);

    // まな板
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#c99a5e'); g.addColorStop(1,'#a87a42');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(90,55,20,.18)'; ctx.lineWidth = 1;
    for (let i=0;i<14;i++){ ctx.beginPath(); const y=H*i/14+8; ctx.moveTo(0,y); ctx.bezierCurveTo(W*.3,y+6,W*.6,y-6,W,y+3); ctx.stroke(); }

    const topH = H*0.58, pad = 20;
    const scale = (W - pad*2) / DOUGH;
    const dX = pad, dY = topH*0.18, dH = topH*0.62;

    // 切った麺
    for (const s of strands){
      const x = dX + s.x*scale, sw = Math.max(1, s.w*scale - 1.5);
      if (s.kind==='break'){
        ctx.fillStyle = '#d8c7a0';
        for (let k=0;k<7;k++){
          const yy = dY + rand(s.seed+k)*dH, hh = 4 + rand(s.seed+k*3)*14;
          ctx.fillRect(x + rand(s.seed+k*7)*3-1.5, yy, sw, hh);
        }
        ctx.fillStyle='rgba(200,40,20,.6)'; ctx.fillRect(x, dY+dH+4, Math.max(2,s.w*scale), 3);
      } else {
        ctx.fillStyle = s.kind==='udon' ? '#efe6cf' : '#cdb98a';
        ctx.fillRect(x, dY, sw, dH);
        ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(x+sw-1, dY, 1, dH);
        ctx.fillStyle = s.kind==='udon' ? 'rgba(120,120,120,.6)' : 'rgba(40,140,60,.6)';
        ctx.fillRect(x, dY+dH+4, Math.max(1,s.w*scale-1), 3);
      }
    }
    // 残りの生地（乾くほど白っぽく）
    const rx = dX + pos*scale, dry = (bp - BREAK0)/(BREAK_MAX - BREAK0);
    const dg = ctx.createLinearGradient(0,dY,0,dY+dH);
    dg.addColorStop(0,'#d9c697'); dg.addColorStop(.5,'#cbb683'); dg.addColorStop(1,'#bba571');
    ctx.fillStyle = dg; ctx.fillRect(rx, dY, dX + DOUGH*scale - rx, dH);
    if (dry > 0){ ctx.fillStyle = `rgba(245,240,225,${dry*.45})`; ctx.fillRect(rx, dY, dX + DOUGH*scale - rx, dH); }
    ctx.fillStyle='rgba(60,40,10,.25)';
    for (let i=0;i<120;i++){ const px = dX + rand(i)*DOUGH*scale; if (px<rx) continue; ctx.fillRect(px, dY + rand(i*1.7)*dH, 1.5, 1.5); }
    if (dry > .3){ // ひび割れ
      ctx.strokeStyle = `rgba(110,80,40,${(dry-.3)*.6})`; ctx.lineWidth = 1;
      for (let i=0;i<10;i++){ const px = dX + rand(i*9.1)*DOUGH*scale; if (px<rx) continue; const py = dY + rand(i*3.3)*dH;
        ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+6,py+5); ctx.lineTo(px+3,py+12); ctx.stroke(); }
    }
    ctx.strokeStyle='rgba(80,55,20,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(rx, dY+dH*.5); ctx.lineTo(dX+DOUGH*scale, dY+dH*.5); ctx.stroke();

    // 駒板と包丁
    if (state==='play' || state==='end'){
      const kx = dX + (pos + w)*scale;
      ctx.fillStyle = 'rgba(60,35,15,.9)';
      ctx.fillRect(kx+2, dY-14, Math.min(60, W-kx), dH+28);
      ctx.fillStyle = '#8a5a2b'; ctx.fillRect(kx+2, dY-14, Math.min(60, W-kx), 6);
      const lift = holding ? 10 : 10*knifeDrop;
      ctx.fillStyle = '#d6dde3';
      ctx.beginPath();
      ctx.moveTo(kx-1, dY-26-lift); ctx.lineTo(kx+1, dY-26-lift);
      ctx.lineTo(kx+1, dY+dH+18-lift); ctx.lineTo(kx-6, dY+dH+18-lift); ctx.lineTo(kx-6, dY-26-lift); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2b1d14'; ctx.fillRect(kx-7, dY-40-lift, 9, 16);
      ctx.strokeStyle = holding ? '#ffd27a' : 'rgba(255,255,255,.6)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(kx, dY-26-lift); ctx.lineTo(kx, dY+dH+18-lift); ctx.stroke();
    }

    ctx.fillStyle='rgba(43,29,20,.85)'; ctx.font='13px system-ui,sans-serif'; ctx.textAlign='right';
    ctx.fillText(`残り ${(DOUGH-pos).toFixed(1)}mm`, W-pad, dY-20);
    ctx.textAlign='left';
    if (combo>=3) ctx.fillText(`${combo}本連続`, pad, dY-20);

    // ---- 拡大ゲージ ----
    const gy = topH + 10, gh = H - gy - 12, gx = 14, gw = W - 28;
    ctx.fillStyle = 'rgba(30,20,12,.9)';
    roundRect(gx, gy, gw, gh, 10); ctx.fill();
    const maxMM = 2.5, gs = (gw-30)/maxMM, bx = gx+15, by = gy + gh*0.42, bh = gh*0.26;
    const zone = (a,b,c) => { if (b<=a) return; ctx.fillStyle=c; ctx.fillRect(bx+a*gs, by, (b-a)*gs, bh); };
    zone(0, bp, 'rgba(200,50,30,.6)');
    zone(bp, bp+.15, 'rgba(255,210,122,.8)');
    zone(bp+.15, bp+.4, 'rgba(80,180,90,.65)');
    zone(bp+.4, UDON, 'rgba(160,150,110,.4)');
    zone(UDON, maxMM, 'rgba(120,120,120,.3)');
    ctx.fillStyle='#f5ead7'; ctx.font='11px system-ui,sans-serif'; ctx.textAlign='center';
    for (let m=0; m<=maxMM+1e-9; m+=0.5){ const x=bx+m*gs; ctx.fillRect(x, by+bh, 1, 6); ctx.fillText(m.toFixed(1), x, by+bh+18); }
    ctx.font='bold 11px system-ui,sans-serif';
    ctx.fillStyle='#ff8a70'; ctx.fillText('ぶち切れ', bx+bp/2*gs, by-6);
    ctx.fillStyle='#ffd27a'; ctx.fillText('神', bx+(bp+.075)*gs, by-6);
    ctx.fillStyle='#8fe09a'; ctx.fillText('名人', bx+(bp+.275)*gs, by-6);
    ctx.fillStyle='#ccc'; ctx.fillText('うどん', bx+(UDON+maxMM)/2*gs, by-6);
    const cw = holding ? w : (strands.length ? strands[strands.length-1].w : 0);
    const nx = bx + Math.min(cw, maxMM)*gs;
    ctx.fillStyle = holding ? '#fff' : 'rgba(255,255,255,.5)';
    ctx.fillRect(bx, by+bh*0.3, Math.max(0,nx-bx), bh*0.4);
    ctx.fillRect(nx-1.5, by-2, 3, bh+4);
    ctx.font = 'bold 22px system-ui,sans-serif'; ctx.textAlign='left';
    ctx.fillStyle = cw < bp && cw>0 ? '#ff8a70' : cw > UDON ? '#ccc' : '#fff';
    ctx.fillText(cw.toFixed(2)+' mm', gx+14, gy+26);
    ctx.font='12px system-ui,sans-serif'; ctx.textAlign='right';
    const sp = curSpeed();
    ctx.fillStyle = sp > 7 ? '#ff8a70' : 'rgba(245,234,215,.7)';
    ctx.fillText(`送り ${sp.toFixed(1)}mm/s`, gx+gw-14, gy+20);
    ctx.fillStyle = dry > .5 ? '#ff8a70' : 'rgba(245,234,215,.7)';
    ctx.fillText(`乾燥 +${(bp-BREAK0).toFixed(2)}mm`, gx+gw-14, gy+36);

    // ポップアップ
    ctx.textAlign='center';
    popups = popups.filter(p => now - p.t < 900);
    for (const p of popups){
      const k = (now-p.t)/900;
      ctx.globalAlpha = 1-k; ctx.fillStyle = p.color; ctx.font='bold 22px "Hiragino Mincho ProN","Yu Mincho",serif';
      ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=4;
      ctx.strokeText(p.text, W/2, dY + dH/2 - k*40); ctx.fillText(p.text, W/2, dY + dH/2 - k*40);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    draw(now, dt);
    requestAnimationFrame(loop);
  }
  reset(); resize(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
